[project]
name = "rsi-harness"
version = "0.1.0"
description = "Governed harness improvement loop for LLM agents (frozen weights)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Amogh" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
rsi-harness = "rsi_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsi_harness"]

[tool.hatch.build.targets.sdist]
include = ["src/rsi_harness", "configs", "DESIGN.md", "README.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/rsi_harness/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["rsi_harness"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "rsi_harness.adapters.tau2.live",
    "rsi_harness.adapters.tau2.llm_bridge",
    "rsi_harness.adapters.tau2.rsi_agent",
]
ignore_missing_imports = true
disable_error_code = [
    "misc",
    "no-any-return",
    "import-not-found",
    "import-untyped",
    "attr-defined",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
