name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Mypy
        run: uv run mypy src/rsi_harness

      - name: Validate split manifests
        run: |
          uv run python scripts/make_splits.py validate data/splits/toy_bench.json
          uv run python scripts/make_splits.py validate data/splits/tau2_mock.json
          uv run python scripts/make_splits.py validate data/splits/tau2_telecom.json

      - name: Pytest
        run: uv run pytest

      - name: CLI smoke
        run: |
          uv run rsi-harness --help
          uv run rsi-harness validate-config configs/ci-mock.yaml
