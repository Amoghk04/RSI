# Second P2+G7 slice. New run_id so the finished 001 checkpoint is not resumed.
# champion_audit false. Cap $2. Same four telecom tasks.
run_id: p2-slice-tau2-telecom-002
workdir: ./runs/tau2-p2-slice-002
seed: 7

llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1

models:
  agent: { name: google/gemini-2.5-flash, temperature: 0.0 }
  user_sim: { name: google/gemini-2.5-flash, temperature: 0.0 }
  proposer: { name: google/gemini-2.5-flash, temperature: 0.7 }

budget:
  total_dollars: 2.0
  per_round_dollars: 2.0
  per_candidate_dollars: 1.0

loop:
  rounds: 1
  opt_batch: 2
  candidates_per_round: 1
  val_tasks_per_round: 2
  seeds: [0]
  patience: 1
  champion_top_k: 1
  champion_audit: false

strategies:
  surface: S3
  diagnoser: { name: d0_none }
  proposer: { name: p2_reflective, max_edit_chars: 800, max_bullets_touched: 3 }
  gate: { name: g7_aa_guard, alpha: 0.05, guard_tolerance: 0.05, k_sigma: 1.0 }
  search: { name: greedy }
  leakage_linter: { min_literal_len: 12 }

benchmark:
  name: tau2
  domain: telecom
  splits_manifest: data/splits/tau2_telecom_slice.json
  use_live_tau2: true
